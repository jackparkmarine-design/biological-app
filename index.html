<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Lab Logger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lab Logger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0a6a85">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<style>
/* Lab Logger v2: bench data entry for lab-processed fish. Same look and storage model as Catch Logger,
   but light (lab) mode by default. Layout: species | measurement tiles + keypad | biology + Save, recent fish below. */
:root{
  --bg:#e8edf0; --surface:#f8fafb; --raised:#ffffff; --ink:#0f1f29; --muted:#566771; --line:#c9d4da;
  --accent:#0a6a85; --on-accent:#ffffff; --accent-soft:#d5e8ee;
  --go:#1c7c45; --on-go:#ffffff; --go-s:#dcf0e3; --warn:#9c5300; --warn-soft:#fbe9d1; --danger:#b3261e; --danger-soft:#f8dedb;
  --amb:#a85f00; --amb-s:#fbe9d1; --male:#2f6db5; --fem:#b0407a; --on-fam:#ffffff; --gen:#7a5a9a; --gen-s:#ece5f3;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
:root[data-theme="dark"]{
  --bg:#0b1216; --surface:#121e26; --raised:#17272f; --ink:#e2ebef; --muted:#8fa1ab; --line:#27404b;
  --accent:#4cb2d0; --on-accent:#05202a; --accent-soft:#15384a;
  --go:#3ab36a; --on-go:#04200e; --go-s:#123220; --warn:#f0a446; --warn-soft:#3a2810; --danger:#f0776d; --danger-soft:#3b1a17;
  --amb:#f0a446; --amb-s:#3a2810; --male:#6aa0e0; --fem:#e07ab0; --on-fam:#0b1216; --gen:#a98bc9; --gen-s:#2a2236;
  color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
main{overflow:auto;padding-inline:14px;padding-block:0 16px;min-height:0}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase;color:var(--accent)}
.stn{display:flex;flex-direction:column;min-width:0;max-width:340px}
.stn b{font-family:var(--f-display);font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stn span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{border-color:var(--go);color:var(--go)}
.pill.bad{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.uibtn{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;min-height:30px;border-radius:999px;border:1px solid var(--line);background:var(--raised);color:var(--ink);cursor:pointer;white-space:nowrap}
.bk.ok{border-color:var(--go);color:var(--go)}.bk.amb{border-color:var(--amb);color:var(--amb);background:var(--amb-s)}.bk.red{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.nav button{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--raised);font-weight:600;cursor:pointer}
.nav button[aria-current="page"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

.lbl{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{min-height:52px;border:1px solid var(--line);background:var(--raised);border-radius:var(--r);font-weight:600;font-size:16px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;padding:4px 8px}
.btn:active{transform:translateY(1px)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.uibtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger.armed,.btn.danger.solid{background:var(--danger);color:var(--on-fam)}
.btn.primary{background:var(--go);border-color:var(--go);color:var(--on-go)}
.mini{min-height:40px;padding:0 12px;font-size:14px}

/* entry */
.entry{display:grid;grid-template-columns:minmax(250px,.9fr) minmax(300px,1fr) minmax(320px,1.15fr);gap:12px;padding-block:12px}
.recent{grid-column:1/-1}
@media (max-width:1000px){.entry{grid-template-columns:1fr 1fr}.col-sp{grid-column:1/-1}}
@media (max-width:640px){.entry{grid-template-columns:1fr}}
.codebox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.codebox b{font-family:var(--f-mono);font-size:22px;letter-spacing:.02em;word-break:break-all}
.codebox.edit{border-color:var(--amb);background:var(--amb-s)}
.codebox.miss{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.spgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (max-width:1000px){.spgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sp{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;padding:6px 30px 6px 10px;min-height:56px;line-height:1.15}
.sp .n{font-size:15px}
.sp .s{font-size:11.5px;font-style:italic;font-weight:400;opacity:.75}
.sp .a{font-family:var(--f-mono);font-size:11px;font-weight:700;opacity:.8}
.cnt{position:absolute;top:6px;right:5px;font-family:var(--f-mono);font-size:12px;font-weight:700;min-width:22px;height:20px;padding:0 5px;border-radius:999px;background:var(--raised);color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.search{min-height:48px;border:1px solid var(--line);border-radius:8px;background:var(--raised);padding:0 12px;width:100%}
.splist{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.splist .sp{min-height:50px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;flex-direction:column;align-items:stretch;text-align:left;min-height:84px;padding:6px 10px;border:1px solid var(--line);background:var(--raised);border-radius:var(--r);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tile .tl{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.tile .tv{font-family:var(--f-mono);font-weight:700;font-size:36px;line-height:1.1;text-align:right;font-variant-numeric:tabular-nums}
.tile .tv.empty{color:var(--line)}
.tile.on{border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--accent)}
.tile.has:not(.on){border-color:var(--go)}
.tile:disabled{opacity:.35}
.tiles.small .tile{min-height:68px}.tiles.small .tv{font-size:26px}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.keypad .btn{min-height:62px;font-family:var(--f-mono);font-size:26px}
.keypad .fn{font-family:var(--f-body);font-size:16px}
.keypad .next{grid-column:span 2;background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-family:var(--f-body);font-size:18px}

.group{display:flex;flex-direction:column;gap:6px}
.seg{display:grid;gap:6px}
.seg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.seg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.seg.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.c5{grid-template-columns:repeat(5,minmax(0,1fr))}.seg.c6{grid-template-columns:repeat(6,minmax(0,1fr))}.seg.c7{grid-template-columns:repeat(7,minmax(0,1fr))}
.seg .btn{min-height:54px}
.seg[data-f="sex"] .btn{font-size:15px;padding:4px 2px}
.seg.stg .btn{font-family:var(--f-mono);font-size:22px;padding:0}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.chip small{font-size:11px;font-weight:500;opacity:.8}
.seg[data-f="sex"] [data-v="M"][aria-pressed="true"]{background:var(--male);border-color:var(--male);color:var(--on-fam)}
.seg[data-f="sex"] [data-v="F"][aria-pressed="true"]{background:var(--fem);border-color:var(--fem);color:var(--on-fam)}
.tog[aria-pressed="true"]{background:var(--go);border-color:var(--go);color:var(--on-go)}
.tog{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.tog small{font-size:11.5px;font-weight:500;opacity:.85}
.genbox{border:1px solid var(--gen);background:var(--gen-s);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px}
.genbox .seg .btn{min-height:48px;font-size:15px}
.genbox .seg .btn[aria-pressed="true"]{background:var(--gen);border-color:var(--gen);color:var(--on-fam)}
.txt{min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--raised);padding:0 12px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row3{display:grid;grid-template-columns:1fr auto;gap:6px}
.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:8px 10px;font-weight:600;font-size:14px}
.warn ul{margin:4px 0 0;padding-left:18px;font-weight:500}
.save{min-height:76px;font-size:24px;font-family:var(--f-display);letter-spacing:.05em;text-transform:uppercase;background:var(--go);border-color:var(--go);color:var(--on-go)}
.save.confirm{background:var(--warn);border-color:var(--warn);color:var(--on-fam)}
.save.edit{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.save small{display:block;font-family:var(--f-mono);font-size:14px;letter-spacing:0;text-transform:none;font-weight:500;opacity:.9}
.lastfish{border:1px solid var(--go);background:var(--go-s);color:var(--go);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.lastfish b{font-family:var(--f-mono)}
.blocked{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:24px 0;max-width:640px}

/* tables */
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12.5px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr[data-id]{cursor:pointer}
tbody tr[data-id]:hover td{background:var(--accent-soft)}
tr.sel td{background:var(--amb-s)}
td.mono{font-family:var(--f-mono);font-size:13px}
td.num{text-align:right}
.tag{font-size:11.5px;font-weight:700;padding:2px 6px;border-radius:5px;border:1px solid var(--line);margin-right:3px}
.tag.g{border-color:var(--gen);color:var(--gen)}.tag.o{border-color:var(--accent);color:var(--accent)}.tag.h{border-color:var(--amb);color:var(--amb)}
.empty td{color:var(--muted);font-style:italic}
.delcell{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.confirmrow td{background:var(--danger-soft);white-space:normal}
.confirmbar{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.delq{font-weight:600;color:var(--danger);font-size:14px}
.stat{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.stat.prog{border-color:var(--warn);color:var(--warn)}.stat.ok{border-color:var(--go);color:var(--go)}

/* other pages */
.page{padding-block:16px;display:flex;flex-direction:column;gap:14px;max-width:1150px}
.page h2{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>.flab{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{min-height:48px;border:1px solid var(--line);border-radius:8px;background:var(--raised);padding:6px 10px;width:100%}
.field input:disabled{opacity:.6}
.field.wide{grid-column:1/-1}.field.half{grid-column:span 2}
@media (max-width:700px){.field.half{grid-column:1/-1}}
.field textarea{min-height:70px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .btn{min-height:46px;padding:0 14px;font-size:15px}
.chips .txt{width:200px;min-height:46px}
.inl{display:flex;gap:6px;align-items:center}
.inl input{flex:1;min-width:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions .btn{padding:0 18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs .btn{min-height:44px;padding:0 14px}
textarea.csv{width:100%;min-height:300px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--raised);padding:10px;white-space:pre;overflow:auto}
.tally{display:flex;flex-wrap:wrap;gap:6px}
.tally span{border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:var(--raised);font-size:13.5px}
.tally b{font-family:var(--f-mono)}
.note{font-size:13.5px;color:var(--muted);max-width:75ch;margin:0}
.bcards{display:flex;flex-direction:column;gap:8px}
.bcard{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--raised)}
.bcard.act{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.bcard h3{margin:0;font-family:var(--f-display);font-size:20px;font-weight:600}
.bcard .code{font-family:var(--f-mono);font-size:14px;font-weight:700;color:var(--accent)}
.bcard .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bcard .acts .btn{min-height:48px;padding:0 16px}
.dupe{background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:10px 14px;font-weight:600}
.sptab input{min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--raised);padding:0 8px;font-family:var(--f-mono)}
.sptab input.ac{width:72px;text-transform:uppercase}.sptab input.cd{width:96px}
.sptab select{min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--raised)}
.sptab td{padding:4px 8px}
.sptab .btn{min-height:40px;min-width:48px;font-size:14px}
.staffrow{display:grid;grid-template-columns:1fr 110px auto;gap:6px;align-items:center}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,12,16,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:620px;width:100%;max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mbox h3{margin:0;font-family:var(--f-display);font-size:22px}
.preview{font-family:var(--f-mono);font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--raised);padding:8px 10px;max-height:200px;overflow:auto;white-space:pre}
.savefail{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-block:10px 0;padding:10px 14px;border-radius:10px;background:var(--danger);color:var(--on-fam);font-size:14.5px}
.savefail .btn{min-height:44px;background:var(--raised);color:var(--ink);border-color:var(--raised)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .15s;pointer-events:none;z-index:40;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
.flash{animation:flash .4s ease-out}
@keyframes flash{from{background:var(--go);color:var(--on-go)}to{}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.toast{transition:none}}
/* ---- v2 ---- */
.seg.c8{grid-template-columns:repeat(8,minmax(0,1fr))}
.seg.oto .btn{font-family:var(--f-mono);font-size:24px}
.seg.oto .btn[aria-pressed="true"]{background:var(--go);border-color:var(--go);color:var(--on-go)}
.tile .est{font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--amb);border:1px solid var(--amb);border-radius:5px;padding:0 4px;margin-left:6px}
.tile.estd .tv{color:var(--amb)}
.tagbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;min-height:54px}
.tagbtn small{font-size:11.5px;font-weight:500;opacity:.85}
.tagbtn.has{background:var(--amb-s);border-color:var(--amb);color:var(--ink)}
.convbtn{min-height:48px;text-align:left;font-family:var(--f-mono);font-size:15px;padding:4px 12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.2}
.convbtn small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500}
.convbtn.empty{font-family:var(--f-body);color:var(--muted)}
.cparts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cparts input{min-height:56px;font-family:var(--f-mono);font-size:22px;text-align:center}
.cresult{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-family:var(--f-mono);font-size:16px}
.cresult.bad{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);font-family:var(--f-body)}
.switch{display:flex;gap:10px;align-items:center}
.switch .btn{min-width:110px}
.eqbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px;align-items:end}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Lab Logger</div>
    <div class="stn"><b id="bTitle">No batch open</b><span id="bSub">—</span></div>
    <div class="pills"><span class="pill" id="savePill">Saved</span><button class="uibtn bk" id="bkPill">Backup</button><button class="uibtn" id="themeBtn"></button></div>
    <nav class="nav" id="nav">
      <button data-v="batches">Batches</button>
      <button data-v="header">Header</button>
      <button data-v="entry">Fish entry</button>
      <button data-v="sheet">Batch sheet</button>
      <button data-v="export">Export</button>
      <button data-v="setup">Setup</button>
    </nav>
  </header>
  <main id="main">
    <div class="savefail" id="saveFail" role="alert" hidden><span><b>The last change could not be saved on this iPad.</b> Make a backup now, then check free space in iPad Settings.</span><button class="btn" id="bkNow2">Back up now</button></div>
    <div id="view"></div>
  </main>
</div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const APP_VERSION='v2';
const LS_KEY='labLogger.v1', DB_NAME='labLogger';
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

  if(!s.staff.length)s.staff=f.staff;

    Object.keys(ren).forEach(o=>{if(s.spEdits[o]){delete s.spEdits[o]}});s.schema=2}

/* ---------- sample codes ----------
   Code = species acronym + capture date (YYMMDD) + iPad letter + batch letter + "-" + fish number, e.g. PS261006KA-01.
   The batch letter is automatic: the first batch on this iPad for a capture date is A, the next B, and so on.
   Fish numbers run separately for each species within a batch. Every code this iPad has issued (including deleted and
   renamed ones) is kept in S.issued and never issued again. Two iPads cannot clash because each has its own letter. */
function mid(b,h){h=h||b.h;return yymmdd(h.capDate)+(b.dev||S.device||'')}
function codeMissing(b){if(!b)return 'Open or start a batch first';
  if(!b.dev&&!S.device)return 'Set this iPad\'s letter in Setup';
  if(!yymmdd(b.h.capDate))return 'Enter the capture date in the Header';return ''}
function letterUsed(m,L,exceptBatch){
  if(S.batches.some(x=>x.id!==exceptBatch&&x.letter===L&&mid(x)===m))return true;
  const re=new RegExp('^[A-Z]+'+m+L+'-\\d+$');for(const c in S.issued){if(re.test(c)&&S.issued[c].b!==exceptBatch)return true}return false}
function freeLetter(b){const m=mid(b);for(let i=0;i<26;i++){const L=String.fromCharCode(65+i);if(!letterUsed(m,L,b.id))return L}return 'Z'}
const batchLetter=b=>b.letter||freeLetter(b);
const batchTag=b=>codeMissing(b)?'':mid(b)+batchLetter(b);
const codeNo=c=>{const m=/-(\d+)$/.exec(c||'');return m?+m[1]:0};
function nextCode(b,acr){const p=acr+mid(b)+batchLetter(b)+'-';let n=0;
  for(const c in S.issued)if(c.startsWith(p))n=Math.max(n,codeNo(c));
  S.fish.forEach(f=>{if(f.code&&f.code.startsWith(p))n=Math.max(n,codeNo(f.code))});
  let code;do{n++;code=p+String(n).padStart(2,'0')}while(S.issued[code]);return code}
function dupCodes(){const seen=new Map(),d=new Set();S.fish.forEach(f=>{if(seen.has(f.code))d.add(f.code);seen.set(f.code,1)});return [...d]}

/* ---------- jaw length → TL estimate ---------- */
function jawToTL(j){const e=S.jawEq||JAW0,a=+e.a,b=+e.b;j=+j;if(!(j>0)||!a)return '';
  const t=e.mode==='tlOnJaw'?a*j+b:(j-b)/a;return t>0?String(Math.round(t)):''}
/* plain ASCII so the note survives any CSV/Access import */
function jawEqText(){const e=S.jawEq||JAW0;return e.mode==='tlOnJaw'?`TL = ${e.a}*jaw + ${e.b}`:`jaw = ${e.a}*TL + ${e.b}, solved for TL`}
const estNote=()=>`TL ESTIMATED from jaw length (${jawEqText()}; R2 = ${(S.jawEq||JAW0).r2})`;

/* ---------- storage: two independent copies on the iPad (as Catch Logger) ---------- */
let db=null,dbOk=null,lsOk=true,writing=Promise.resolve(),pend=false;const savedJson=new Map();
function openDB(){return new Promise(res=>{try{const rq=indexedDB.open(DB_NAME,1);
  rq.onupgradeneeded=()=>{const d=rq.result;if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta');if(!d.objectStoreNames.contains('fish'))d.createObjectStore('fish',{keyPath:'id'})};
  rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(null);rq.onblocked=()=>res(null)}catch(e){res(null)}})}
function idbLoad(){return new Promise(res=>{try{const tx=db.transaction(['meta','fish'],'readonly');let meta=null,fs=[];
  tx.objectStore('meta').get('state').onsuccess=e=>{meta=e.target.result||null};tx.objectStore('fish').getAll().onsuccess=e=>{fs=e.target.result||[]};
  tx.oncomplete=()=>res(meta?Object.assign({},meta,{fish:fs}):null);tx.onerror=tx.onabort=()=>res(null)}catch(e){res(null)}})}
function idbWrite(){return new Promise(res=>{try{const meta=Object.assign({},S);delete meta.fish;
  const tx=db.transaction(['meta','fish'],'readwrite'),os=tx.objectStore('fish'),seen=new Set(),changed=[];
  S.fish.forEach(r=>{seen.add(r.id);const j=JSON.stringify(r);if(savedJson.get(r.id)!==j){os.put(JSON.parse(j));changed.push([r.id,j])}});
  const gone=[...savedJson.keys()].filter(id=>!seen.has(id));gone.forEach(id=>os.delete(id));
  tx.objectStore('meta').put(JSON.parse(JSON.stringify(meta)),'state');
  tx.oncomplete=()=>{changed.forEach(([i,j])=>savedJson.set(i,j));gone.forEach(i=>savedJson.delete(i));res(true)};
  tx.onerror=tx.onabort=()=>res(false)}catch(e){res(false)}})}
function lsLoad(){try{const t=localStorage.getItem(LS_KEY);if(t)return JSON.parse(t)}catch(e){}return null}
function save(){S.savedAt=new Date().toISOString();
  lsOk=true;try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){lsOk=false}
  if(db){if(!pend){pend=true;writing=writing.then(()=>{pend=false;return idbWrite()}).then(ok=>{dbOk=ok;saveStatus()})}}else dbOk=false;
  saveStatus()}
function saveStatus(){const ok=lsOk||dbOk===true||(dbOk===null&&!!db),p=$('#savePill');
  p.textContent=ok?'Saved on device':'NOT SAVING';p.className='pill '+(ok?'ok':'bad');$('#saveFail').hidden=ok;renderBk()}

/* ---------- backups ---------- */
function bkLevel(){const bk=S.backup&&S.backup.at?new Date(S.backup.at):null;
  const since=S.fish.filter(r=>!bk||new Date(r.edited||r.ts)>bk).length,mins=bk?(Date.now()-bk)/60000:Infinity;
  if(!S.fish.length)return {lvl:'ok',txt:'No data yet'};
  if(!bk)return {lvl:'red',txt:`Not backed up · ${since} fish`};
  const lvl=since===0?'ok':(since>=300||mins>=240)?'red':(since>=100||mins>=120)?'amb':'ok';
  return {lvl,txt:`Backup ${hm(S.backup.at)}${since?` · ${since} since`:' · up to date'}`}}
function renderBk(){const b=$('#bkPill');if(!b||!S)return;const {lvl,txt}=bkLevel();b.textContent=txt;b.className='uibtn bk '+lvl}
setInterval(()=>{try{renderBk()}catch(e){}},60000);
function stampName(){const d=new Date();return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`}
async function fullBackup(){
  const name=`lablogger_backup_${S.device||'X'}_${stampName()}.json`;
  const body=JSON.stringify({app:'lab-logger',format:1,appVersion:APP_VERSION,exportedAt:new Date().toISOString(),device:S.device,
    counts:{batches:S.batches.length,fish:S.fish.length},state:S});
  const ok=await shareFiles([new File([body],name,{type:'application/json'})],name,`Backup saved (${S.fish.length} fish)`);
  if(ok){S.backup={at:new Date().toISOString()};save()}return ok}
/* iOS only shares straight after a tap; if that fails, offer a "ready" button. */
async function shareFiles(files,title,okMsg){
  try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,title});toast(okMsg);return true}}
  catch(e){if(e&&e.name==='AbortError'){toast('Cancelled. Data is still on this iPad');return false}
    if(e&&e.name==='NotAllowedError')return readyToShare(files,title,okMsg)}
  if(window.top!==window.self){toast('Files save from the installed app, not this preview');return false}
  files.forEach((f,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)},i*600));
  toast(okMsg);return true}
function readyToShare(files,title,okMsg){return new Promise(res=>{
  modal(`<h3>Ready to save</h3><p class="note">${files.length} file(s) prepared.</p><div class="actions"><button class="btn primary" id="mGo">Save / share now</button><button class="btn" id="mNo">Cancel</button></div>`);
  $('#mGo').onclick=async()=>{closeModal();try{await navigator.share({files,title});toast(okMsg);res(true)}catch(e){toast('Not saved');res(false)}};
  $('#mNo').onclick=()=>{closeModal();res(false)}})}

function activate(id){if(S.active!==id){const keep=S.cur,last=bFish(id).slice(-1)[0];S.active=id;S.cur=blankCur({his:keep.his,guts:keep.guts,micro:keep.micro,more:keep.more,sp:last?last.sp:null})}save()}
function newBatch(){const last=S.batches.slice().sort((a,b)=>String(b.created).localeCompare(String(a.created)))[0];
  const b={id:uid(),created:new Date().toISOString(),dev:S.device,letter:'',done:false,h:defaultHeader(last&&last.h)};
  S.batches.push(b);activate(b.id);toast('New batch started. Fill in the header');show('header')}

/* ================= HEADER ================= */
function chipField(key,label,list,h,cls){const opts=[...LISTS[list],...((S.extra[list])||[])],v=h[key]||'',other=v&&!opts.includes(v);
  return `<div class="field ${cls||'wide'}"><span class="flab">${label}</span><div class="chips" data-chip="${key}" data-list="${list}">
    ${opts.map(o=>`<button class="btn" data-v="${esc(o)}" aria-pressed="${v===o}">${esc(o)}</button>`).join('')}
    <button class="btn" data-v="__other" aria-pressed="${other}">Other…</button>
    <input class="txt" data-otherfor="${key}" placeholder="Type other value" value="${other?esc(v):''}"${other?'':' hidden'} aria-label="${label} other value"></div></div>`}
function staffChips(key,h){const st=S.staff||[];
  return `<div class="chips" data-staff="${key}">${st.map(p=>`<button class="btn" data-init="${esc(p.init)}" aria-pressed="${h[key==='proc'?'procInit':'scribe']===p.init}">${esc(p.name)}</button>`).join('')||'<span class="note">Add staff in Setup first.</span>'}</div>`}
function nsAuto(b){const t={};bFish(b.id).forEach(f=>t[f.sp]=(t[f.sp]||0)+1);const top=Object.entries(t).sort((x,y)=>y[1]-x[1])[0];return top?{sp:spName(top[0]),n:top[1]}:{sp:'',n:''}}
function fmtDD(v,isLat){if(v===''||v==null||isNaN(+v))return '';v=+v;const a=Math.abs(v);let d=Math.floor(a),m=(a-d)*60;if(+m.toFixed(3)>=60){d++;m=0}
  return `${d}° ${m.toFixed(3)}′ ${isLat?(v<0?'S':'N'):(v<0?'W':'E')}`}
function posBtn(k,h){const isLat=k==='lat',v=h[k];return `<button class="btn convbtn${v===''?' empty':''}" data-conv="${k}">${v===''?`Tap to enter ${isLat?'latitude':'longitude'}`:`${(+v).toFixed(5)}<small>${esc(fmtDD(v,isLat))}${h[k+'Raw']?' · entered as '+esc(h[k+'Raw']):''}</small>`}</button>`}
function viewHeader(){const el=$('#view');el.className='page';const b=activeB();
  if(!b){el.innerHTML=`<h2>Header</h2><p class="note">No batch is open.</p><div class="actions"><button class="btn primary" id="gb">Go to Batches</button></div>`;$('#gb').onclick=()=>show('batches');return}
  const h=b.h,n=bFish(b.id).length,lock=n>0,ns=nsAuto(b),F=(k,l,t,x)=>`<div class="field ${x&&x.cls||''}"><label for="h_${k}">${l}</label><input id="h_${k}" data-h="${k}" type="${t||'text'}" value="${esc(h[k])}"${x&&x.im?` inputmode="${x.im}"`:''}${x&&x.ph?` placeholder="${esc(x.ph)}"`:''}${x&&x.dis?' disabled':''}${x&&x.list?` list="${x.list}"`:''} autocomplete="off"></div>`;
  const locs=[...new Set(S.batches.map(x=>x.h.location).filter(Boolean))];
  el.innerHTML=`<h2>Batch header</h2>
  <div class="panel"><span class="lbl">Sample code</span>
    <div class="codebox${codeMissing(b)?' miss':''}"><b>${esc(codeMissing(b)?codeMissing(b):'XX'+batchTag(b)+'-01')}</b><span class="small">${codeMissing(b)?'':'XX = species acronym · capture '+esc(yymmdd(h.capDate))+' · iPad '+esc(b.dev||S.device)+' · batch '+esc(batchLetter(b))+(b.letter?'':' (provisional, fixed at the first fish)')}</span></div>
    ${lock?`<p class="note">${n} fish already have codes, so the capture date and batch letter are locked. Use <b>Rename codes</b> to change them for every fish in this batch at once.</p><div class="actions"><button class="btn" id="renB">Rename codes…</button></div>`:''}
  </div>
  <div class="panel"><span class="lbl">Batch</span><div class="form">
    ${F('project','Project')}${F('capDate','Date of capture','date',{dis:lock})}${F('procDate','Date of processing','date')}
    <div class="field wide"><span class="flab">Processed by</span>${staffChips('proc',h)}</div>
    <div class="field wide"><span class="flab">Scribe</span>${staffChips('scribe',h)}</div>
    <div class="field wide"><span class="flab">Whole-fish weight (boat ramp surveys; processed fish are filleted)</span>
      <div class="switch" data-wt><button class="btn" data-wv="1" aria-pressed="${!!h.wtOn}">Weigh whole fish</button><button class="btn" data-wv="0" aria-pressed="${!h.wtOn}">No total weight</button></div></div>
  </div></div>
  <div class="panel"><span class="lbl">Where</span><div class="form">
    ${chipField('bioregion','Bioregion','bioregion',h)}${chipField('zone','Zone','zone',h)}
    ${F('location','Location','text',{list:'locList',cls:'half'})}<datalist id="locList">${locs.map(l=>`<option value="${esc(l)}">`).join('')}</datalist>
    ${F('mapRef','Map ref / coord')}
    <div class="field"><span class="flab">Latitude</span>${posBtn('lat',h)}</div>
    <div class="field"><span class="flab">Longitude</span>${posBtn('lon',h)}</div>
    <div class="field half"><label for="h_depth">Depth (as the fisher gave it)</label><div class="inl"><input id="h_depth" data-h="depth" inputmode="decimal" value="${esc(h.depth)}" autocomplete="off" style="max-width:120px">
      <div class="chips" data-du>${Object.entries(DEPTH_U).map(([k,[l]])=>`<button class="btn" data-u="${k}" aria-pressed="${(h.depthUnit||'m')===k}">${l}</button>`).join('')}</div></div>
      <span class="small muted" id="depthM">${depthNote(h)}</span></div>
  </div><p class="note">Positions: tap and choose the format the fisher used (decimal degrees, degrees + decimal minutes, or degrees minutes seconds). Stored and exported as decimal degrees. Depth is converted to metres.</p></div>
  <div class="panel"><span class="lbl">Source</span><div class="form">
    ${chipField('collPoint','Collection point','collPoint',h)}${chipField('method','Method','method',h)}
    ${chipField('collector','Collector','collector',h)}${chipField('sector','Sector','sector',h)}${chipField('bait','Bait / lure','bait',h)}
    ${F('fisherName','Fisher name','text',{cls:'half'})}${F('fisherId','Fisher PeopleID (if known)','text',{im:'numeric'})}
  </div></div>
  <div class="panel"><span class="lbl">Other</span><div class="form">
    ${F('temp','Temperature (°C)','text',{im:'decimal'})}${F('sal','Salinity','text',{im:'decimal'})}
    ${F('nsSp','No. samples: species','text',{ph:ns.sp?'auto: '+ns.sp:'auto from the fish'})}${F('nsN','No. samples: number','text',{im:'numeric',ph:ns.n!==''?'auto: '+ns.n:'auto'})}
    <div class="field wide"><label for="h_multiBlock">Multi.Block</label><textarea id="h_multiBlock" data-h="multiBlock">${esc(h.multiBlock)}</textarea></div>
    <div class="field wide"><label for="h_comments">Comments</label><textarea id="h_comments" data-h="comments">${esc(h.comments)}</textarea></div>
  </div><p class="note">No. samples fills itself from the main species in the batch and its count. Type over it only if it should be different.</p></div>
  <div class="actions"><button class="btn primary" id="toEntry">Go to fish entry</button></div>`;
  el.querySelectorAll('[data-h]').forEach(inp=>inp.addEventListener('input',()=>{h[inp.dataset.h]=inp.value;
    if(inp.dataset.h==='capDate')h.project=fyOf(inp.value);
    if(inp.dataset.h==='depth')$('#depthM').textContent=depthNote(h);
    save();renderTop()}));
  el.querySelectorAll('[data-h="capDate"]').forEach(i=>i.addEventListener('change',()=>viewHeaderKeep()));
  el.querySelectorAll('[data-chip]').forEach(g=>g.onclick=e=>{const bt=e.target.closest('[data-v]');if(!bt)return;const k=g.dataset.chip,inp=g.querySelector('[data-otherfor]');
    if(bt.dataset.v==='__other'){inp.hidden=false;inp.focus();g.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',x===bt));return}
    h[k]=h[k]===bt.dataset.v?'':bt.dataset.v;inp.hidden=true;inp.value='';
    if(k==='collPoint'&&h[k]==='Boat ramp'&&!h.wtTouched)h.wtOn=true;
    save();viewHeaderKeep()});
  el.querySelectorAll('[data-otherfor]').forEach(inp=>{inp.addEventListener('input',()=>{h[inp.dataset.otherfor]=inp.value.trim();save();renderTop()});
    inp.addEventListener('change',()=>{const v=inp.value.trim(),g=inp.closest('[data-chip]'),l=g.dataset.list;if(v&&!LISTS[l].includes(v)){S.extra[l]=S.extra[l]||[];if(!S.extra[l].includes(v))S.extra[l].push(v);save()}})});
  el.querySelectorAll('[data-staff]').forEach(g=>g.onclick=e=>{const bt=e.target.closest('[data-init]');if(!bt)return;const p=S.staff.find(x=>x.init===bt.dataset.init);
    if(g.dataset.staff==='proc'){h.procInit=h.procInit===p.init?'':p.init;h.procName=h.procInit?p.name:''}else h.scribe=h.scribe===p.init?'':p.init;
    save();viewHeaderKeep()});
  el.querySelector('[data-wt]').onclick=e=>{const bt=e.target.closest('[data-wv]');if(!bt)return;h.wtOn=bt.dataset.wv==='1';h.wtTouched=true;if(!h.wtOn&&S.cur.focus==='wt')S.cur.focus='tl';save();viewHeaderKeep()};
  el.querySelectorAll('[data-conv]').forEach(x=>x.onclick=()=>posDialog(b,x.dataset.conv));
  el.querySelector('[data-du]').onclick=e=>{const bt=e.target.closest('[data-u]');if(!bt)return;h.depthUnit=bt.dataset.u;save();viewHeaderKeep()};
  const rb=$('#renB');if(rb)rb.onclick=()=>renameDialog(b);
  $('#toEntry').onclick=()=>show('entry')}
function viewHeaderKeep(){const y=$('#main').scrollTop;viewHeader();renderTop();$('#main').scrollTop=y}
function depthM(h){const v=parseFloat(h.depth);if(!isFinite(v))return '';const u=DEPTH_U[h.depthUnit||'m']||DEPTH_U.m;return String(Math.round(v*u[1]*10)/10)}
function depthNote(h){const m=depthM(h);return m===''?'Stored in metres':(h.depthUnit||'m')==='m'?'Stored in metres':`= ${m} m (stored in metres)`}

/* Position converter: the fisher's format in, decimal degrees out. Latitude defaults to S, longitude to E. */
function parseCoord(v,isLat){v=String(v||'').trim();if(!v)return null;const neg=/^-|[SW]\s*$/i.test(v)||isLat;
  const n=v.replace(/[^\d.\s]/g,' ').trim().split(/\s+/).map(Number);if(!n.length||n.some(x=>!isFinite(x)))return NaN;
  let d=n[0]+(n[1]||0)/60+(n[2]||0)/3600;if(n.length===1)d=n[0];if((n[1]||0)>=60||(n[2]||0)>=60)return NaN;
  if(isLat&&(d<9||d>45))return NaN;if(!isLat&&(d<100||d>130))return NaN;return Math.round((neg?-d:d)*1e6)/1e6}
function posDialog(b,k){const h=b.h,isLat=k==='lat';let fmt=h[k+'Fmt']||'dm',hemi=isLat?'S':'E';
  const draw=()=>{const L=fmt==='dd'?['Degrees (decimal)']:fmt==='dm'?['Degrees','Minutes (decimal)']:['Degrees','Minutes','Seconds'];
    modal(`<h3>${isLat?'Latitude':'Longitude'}</h3>
    <div class="tabs" data-fmt>${[['dd','Decimal degrees'],['dm','Deg + decimal min'],['dms','Deg min sec']].map(([f,l])=>`<button class="btn" data-f="${f}" aria-pressed="${fmt===f}">${l}</button>`).join('')}</div>
    <div class="cparts" style="grid-template-columns:repeat(${L.length},minmax(0,1fr))">${L.map((l,i)=>`<div class="field"><label for="cp${i}">${l}</label><input id="cp${i}" class="txt" inputmode="decimal" autocomplete="off"></div>`).join('')}</div>
    <div class="tabs" data-hemi>${(isLat?['S','N']:['E','W']).map(x=>`<button class="btn" data-h="${x}" aria-pressed="${hemi===x}">${x}</button>`).join('')}</div>
    <div class="cresult" id="cRes">—</div>
    <div class="actions"><button class="btn primary" id="cUse">Use this</button><button class="btn" id="cClr">Clear position</button><button class="btn" id="cNo">Cancel</button></div>`);
    const calc=()=>{const p=L.map((_,i)=>$('#cp'+i).value.trim());if(p.every(x=>x===''))return null;const nums=p.map(x=>x===''?0:parseFloat(x));
      if(nums.some(x=>!isFinite(x)||x<0))return NaN;if(nums.slice(1).some(x=>x>=60))return NaN;
      const d=nums[0]+(nums[1]||0)/60+(nums[2]||0)/3600,lim=isLat?[9,45]:[100,130];if(d<lim[0]||d>lim[1])return NaN;
      return {dd:Math.round((hemi==='S'||hemi==='W'?-d:d)*1e6)/1e6,raw:fmt==='dd'?`${p[0]}° ${hemi}`:fmt==='dm'?`${p[0]}° ${p[1]||0}′ ${hemi}`:`${p[0]}° ${p[1]||0}′ ${p[2]||0}″ ${hemi}`}};
    const upd=()=>{const r=calc(),o=$('#cRes');if(r===null){o.className='cresult';o.textContent='Enter the numbers as the fisher gave them';$('#cUse').disabled=true;return}
      if(Number.isNaN(r)){o.className='cresult bad';o.textContent=`Check the numbers: minutes and seconds under 60, ${isLat?'latitude 9–45°':'longitude 100–130°'} for WA`;$('#cUse').disabled=true;return}
      o.className='cresult';o.textContent=`${r.dd.toFixed(5)}  =  ${fmtDD(r.dd,isLat)}`;$('#cUse').disabled=false};
    L.forEach((_,i)=>$('#cp'+i).addEventListener('input',upd));upd();$('#cp0').focus();
    document.querySelector('[data-fmt]').onclick=e=>{const x=e.target.closest('[data-f]');if(x){fmt=x.dataset.f;draw()}};
    document.querySelector('[data-hemi]').onclick=e=>{const x=e.target.closest('[data-h]');if(x){hemi=x.dataset.h;document.querySelectorAll('[data-hemi] [data-h]').forEach(y=>y.setAttribute('aria-pressed',y===x));upd()}};
    $('#cUse').onclick=()=>{const r=calc();if(!r||Number.isNaN(r))return;h[k]=r.dd.toFixed(6);h[k+'Raw']=r.raw;h[k+'Fmt']=fmt;save();closeModal();viewHeaderKeep()};
    $('#cClr').onclick=()=>{h[k]='';h[k+'Raw']='';save();closeModal();viewHeaderKeep()};
    $('#cNo').onclick=closeModal};
  draw()}

/* rename every code in a batch (after cross-referencing with the other iPad or paper) */
function renameDialog(b){const fs=bFish(b.id);
  modal(`<h3>Rename codes for this batch</h3>
  <p class="note">Changes the capture date, iPad letter or batch letter in all ${fs.length} codes in this batch. Fish numbers stay the same. Old codes are kept on record and never issued again. Relabel any envelopes or vials already written.</p>
  <div class="form">
    <div class="field"><label for="r_date">Capture date</label><input id="r_date" type="date" value="${esc(b.h.capDate)}"></div>
    <div class="field"><label for="r_dev">iPad letter</label><input id="r_dev" maxlength="1" value="${esc(b.dev||S.device)}" style="text-transform:uppercase"></div>
    <div class="field"><label for="r_let">Batch letter</label><input id="r_let" maxlength="1" value="${esc(batchLetter(b))}" style="text-transform:uppercase"></div>
  </div>
  <div class="preview" id="r_prev"></div><div id="r_msg"></div>
  <div class="actions"><button class="btn primary" id="r_go">Rename all</button><button class="btn" id="r_no">Cancel</button></div>`);
  const calc=()=>{const date=$('#r_date').value,dev=$('#r_dev').value.trim().toUpperCase(),L=$('#r_let').value.trim().toUpperCase();
    const err=!yymmdd(date)?'Enter a capture date':!/^[A-Z]$/.test(dev)?'iPad letter: one letter A to Z':!/^[A-Z]$/.test(L)?'Batch letter: one letter A to Z':'';
    const nm=yymmdd(date)+dev+L,om=mid(b)+batchLetter(b);
    const pairs=fs.map(f=>{const i=f.code.lastIndexOf(om+'-');const nc=i>=0?f.code.slice(0,i)+nm+f.code.slice(i+om.length):f.code;return [f,nc]});
    const own=new Set(fs.map(f=>f.code));
    const clash=pairs.filter(([f,nc])=>nc!==f.code&&((S.issued[nc]&&S.issued[nc].b!==b.id)||(S.fish.some(x=>x.code===nc&&!own.has(x.code)))));
    return {date,dev,L,err,pairs,clash,same:nm===om}};
  const upd=()=>{const r=calc();$('#r_prev').textContent=r.pairs.slice(0,40).map(([f,nc])=>`${f.code}  →  ${nc}`).join('\n')+(r.pairs.length>40?`\n… ${r.pairs.length-40} more`:'');
    $('#r_msg').innerHTML=r.err?`<p class="warn">${r.err}</p>`:r.clash.length?`<p class="warn">${r.clash.length} new code(s) already exist on this iPad, e.g. ${esc(r.clash[0][1])}. Choose another batch letter.</p>`:r.same?'<p class="note">No change.</p>':'';
    $('#r_go').disabled=!!(r.err||r.clash.length||r.same)};
  ['r_date','r_dev','r_let'].forEach(i=>$('#'+i).addEventListener('input',upd));upd();
  $('#r_no').onclick=closeModal;
  $('#r_go').onclick=()=>{const r=calc();if(r.err||r.clash.length||r.same)return;const now=new Date().toISOString();
    r.pairs.forEach(([f,nc])=>{if(nc===f.code)return;if(S.issued[f.code])S.issued[f.code].st='renamed:'+nc;S.issued[nc]={b:b.id,f:f.id,t:now,st:'active'};
      if(f.gvial===f.code)f.gvial=nc;f.code=nc;f.edited=now});
    b.h.capDate=r.date;b.h.project=fyOf(r.date);b.dev=r.dev;b.letter=r.L;save();closeModal();toast(`Renamed ${r.pairs.length} codes`);show(view)}}

/* ================= FISH ENTRY ================= */
function viewEntry(){const el=$('#view');const b=activeB(),miss=codeMissing(b);
  if(miss){el.className='page';el.innerHTML=`<div class="blocked"><h2>Fish entry</h2><p class="warn">${esc(miss)}.</p><div class="actions">${!b?'<button class="btn primary" data-go="batches">Batches</button>':!(b.dev||S.device)?'<button class="btn primary" data-go="setup">Setup</button>':'<button class="btn primary" data-go="header">Header</button>'}</div></div>`;
    el.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>show(x.dataset.go));return}
  if(!mainTiles().includes(S.cur.focus)&&!MORE_TILES.includes(S.cur.focus))S.cur.focus='tl';
  el.className='entry';
  el.innerHTML=`<div class="panel col-sp" id="pSp"></div><div class="panel col-pad" id="pPad"></div><div class="panel col-attr" id="pAttr"></div><div class="panel recent" id="pRec"></div>`;
  renderEntry();el.onclick=entryClick;el.oninput=entryInput}
function renderEntry(){renderSp();renderPad();renderAttr();renderRecent();renderTop()}
function curCode(){const b=activeB(),c=S.cur,sp=c.sp&&spBy(c.sp);if(!sp)return '';
  if(c.editId){const f=S.fish.find(x=>x.id===c.editId);if(f&&f.sp===c.sp)return f.code}return nextCode(b,sp.acr)}
function renderSp(){const b=activeB(),c=S.cur,fs=bFish(b.id),cnt={};fs.forEach(f=>cnt[f.sp]=(cnt[f.sp]||0)+1);
  const quick=[...new Set([...Object.keys(cnt),...(c.sp?[c.sp]:[]),...[...spAll().values()].filter(s=>s.fav).map(s=>s.sci)])].slice(0,16).map(spBy).filter(Boolean);
  const code=curCode(),edit=!!c.editId;
  $('#pSp').innerHTML=`<div class="codebox${edit?' edit':''}"><span class="lbl">${edit?'Editing fish':'Code for the envelope'}</span><b>${esc(code||'pick a species')}</b>${edit?'<span class="small">Changes save over this fish</span>':''}</div>
  <span class="lbl">Species</span><div class="spgrid">${quick.map(s=>spBtn(s,cnt[s.sci],c.sp===s.sci)).join('')}</div>
  <input class="search" id="spQ" placeholder="Search name, scientific name or acronym" value="${esc(spQ)}" autocomplete="off" aria-label="Search species">
  <div class="splist" id="spList">${spResults()}</div>
  <button class="btn" data-act="othersp">Other species (not on the list)…</button>`}
function spBtn(s,n,on){return `<button class="btn sp" data-sp="${esc(s.sci)}" aria-pressed="${!!on}"><span class="n">${esc(s.common)}</span><span class="s">${esc(s.other?'added on this iPad':s.sci)}</span><span class="a">${esc(s.acr)}${s.code?' · '+esc(s.code):''}</span>${n?`<span class="cnt">${n}</span>`:''}</button>`}
function spResults(){const q=spQ.trim().toLowerCase();if(!q)return '';
  const r=[...spAll().values()].filter(s=>s.common.toLowerCase().includes(q)||s.sci.toLowerCase().includes(q)||s.acr.toLowerCase()===q).slice(0,30);
  return r.map(s=>spBtn(s,0,S.cur.sp===s.sci)).join('')||'<p class="note">No match. Use Other species below.</p>'}
function tileHTML(k){const c=S.cur,t=TILES[k],sp=c.sp&&spBy(c.sp),dis=k==='fl'&&sp&&!sp.fl,v=c[k],est=k==='tl'&&c.tlcalc&&v!=='';
  const unit=k==='jaw'&&sp&&sp.jaw?'mm → TL':t.u;
  return `<button class="tile${c.focus===k?' on':''}${v!==''?' has':''}${est?' estd':''}" data-tile="${k}"${dis?' disabled':''}><span class="tl"><span>${t.l}${est?'<span class="est">ESTIMATE</span>':''}</span><span>${dis?'n/a':unit}</span></span><span class="tv${v===''?' empty':''}">${v===''?'—':esc(v)}</span></button>`}
function renderPad(){const c=S.cur,t=TILES[c.focus]||TILES.tl;
  $('#pPad').innerHTML=`<div class="tiles">${mainTiles().map(tileHTML).join('')}</div>
  <div class="keypad">${['1','2','3','4','5','6','7','8','9','.','0','DEL'].map(k=>`<button class="btn${k==='DEL'?' fn':''}" data-k="${k}"${k==='.'&&!t.dp?' disabled':''}>${k==='DEL'?'⌫ Back':k}</button>`).join('')}
    <button class="btn fn" data-k="CLR">Clear</button><button class="btn next" data-k="NEXT">Next ▶</button></div>
  <button class="btn" data-act="more" aria-expanded="${c.more}">${c.more?'Hide extra fields ▴':'Extra fields (block, depth, time, oto slide) ▾'}</button>
  ${c.more?`<div class="tiles small">${MORE_TILES.map(tileHTML).join('')}</div>
   <div class="field"><label for="e_time">Time</label><div class="inl"><input class="txt" id="e_time" data-e="time" type="time" value="${esc(c.time)}"><button class="btn mini" data-act="now">Now</button></div></div>
   <div class="field"><label for="e_os">Oto slide</label><input class="txt" id="e_os" data-e="otoslide" value="${esc(c.otoslide)}" autocomplete="off"></div>`:''}`}

function touch(){const c=S.cur;c.ack=false;c.warn=[]}
function nextTile(k){const sp=S.cur.sp&&spBy(S.cur.sp),order=MORE_TILES.includes(k)?MORE_TILES:mainTiles().filter(x=>x!=='jaw'||k==='jaw');let i=order.indexOf(k);
  for(let j=1;j<=order.length;j++){const n=order[(i+j)%order.length];if(n==='fl'&&sp&&!sp.fl)continue;return n}return k}
function applyJaw(){const c=S.cur,sp=c.sp&&spBy(c.sp);if(!sp||!sp.jaw)return;
  if(c.tl===''||c.tlcalc){const t=c.jaw===''?'':jawToTL(c.jaw);c.tl=t;c.tlcalc=t!==''}}
function key(k){const c=S.cur,f=c.focus,t=TILES[f];let v=c[f]||'';
  if(k==='NEXT'){c.focus=nextTile(f);renderPad();return}
  if(k==='CLR')v='';else if(k==='DEL')v=v.slice(0,-1);
  else if(k==='.'){if(!t.dp||v.includes('.'))return;v=(v||'0')+'.'}
  else{const [a,d]=v.split('.');if(d!=null){if(d.length>=t.dp)return}else if((a||'').length>=t.max)return;v=(v+k).replace(/^0+(?=\d)/,'')}
  c[f]=v;if(f==='tl')c.tlcalc=false;if(f==='jaw')applyJaw();touch();renderPad();renderAttr()}
function entryClick(e){const c=S.cur,t=e.target;
  const sp=t.closest('[data-sp]');if(sp){if(c.sp!==sp.dataset.sp){c.sp=sp.dataset.sp;const s=spBy(c.sp);if(s&&!s.fl){c.fl='';if(c.focus==='fl')c.focus='gwt'}if(s&&+c.stage>s.stages)c.stage='';
      if(c.tlcalc&&!(s&&s.jaw)){c.tl='';c.tlcalc=false}else applyJaw();
      if(!c.editId){c.his=false;c.guts=false;c.micro=false}}spQ='';touch();renderSp();renderPad();renderAttr();return}
  const tl=t.closest('[data-tile]');if(tl){c.focus=tl.dataset.tile;renderPad();return}
  const k=t.closest('[data-k]');if(k){key(k.dataset.k);return}

  const ot=t.closest('[data-oto]');if(ot){c.otoN=c.otoN===ot.dataset.oto?'':ot.dataset.oto;touch();renderAttr();return}
  const tg=t.closest('[data-tog]');if(tg){const k2=tg.dataset.tog;c[k2]=!c[k2];touch();renderAttr();return}
  const g=t.closest('[data-g] [data-v]');if(g){const k2=g.closest('[data-g]').dataset.g;c[k2]=c[k2]===g.dataset.v?'':g.dataset.v;touch();renderAttr();return}
  const tr=t.closest('tr[data-id]');if(tr){startEdit(tr.dataset.id);return}
  const a=t.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='more'){c.more=!c.more;if(!c.more&&MORE_TILES.includes(c.focus))c.focus='tl';renderPad();return}

  if(act==='save'){commit();return}
  if(act==='tag'){tagDialog();return}
  if(act==='othersp'){otherSpDialog(true);return}
  if(act==='cancel'){S.cur=blankCur(c);renderEntry();return}
  if(act==='sheet'){show('sheet');return}}

/* checks: soft warnings; a second tap on Save saves anyway */
function lwFit(sci,lk,exclude){const pts=S.fish.filter(f=>f.sp===sci&&f.id!==exclude&&!f.tlcalc&&+f[lk]>0&&+f.wt>0).map(f=>[Math.log(+f[lk]),Math.log(+f.wt)]);
  if(pts.length<10)return null;const n=pts.length,mx=pts.reduce((s,p)=>s+p[0],0)/n,my=pts.reduce((s,p)=>s+p[1],0)/n;
  let sxx=0,sxy=0;pts.forEach(([x,y])=>{sxx+=(x-mx)**2;sxy+=(x-mx)*(y-my)});if(!sxx)return null;const b=sxy/sxx,a=my-b*mx;
  const sd=Math.sqrt(pts.reduce((s,[x,y])=>s+(y-a-b*x)**2,0)/Math.max(1,n-2));return {a,b,sd,n}}
function checks(c,sp){const w=[],N=k=>c[k]===''?null:+c[k];const tl=N('tl'),fl=N('fl'),wt=activeB().h.wtOn?N('wt'):null,gwt=N('gwt');
  [['TL',tl],['FL',fl]].forEach(([l,v])=>{if(v!=null&&(v<30||v>2500))w.push(`${l} ${v} mm is outside 30 to 2500 mm`)});
  if(tl!=null&&fl!=null&&fl>tl)w.push(`FL (${fl}) is longer than TL (${tl})`);
  if(wt!=null&&gwt!=null&&gwt>=wt)w.push(`Gonad weight (${gwt} g) is not less than total weight (${wt} g)`);
  if(c.stage&&!['M','F','T'].includes(c.sex))w.push('Stage entered but sex is not Male, Female or Transitional');
  if(gwt!=null&&!c.sex)w.push('Gonad weight entered with no sex');
  if(tl==null&&fl==null&&!c.jaw)w.push('No length recorded (TL, FL or jaw)');
  if(c.otoN==='')w.push('Otoliths extracted (0, 1 or 2) not entered');
  if(c.jaw&&!(sp&&sp.jaw)&&tl==null)w.push(`No TL estimate: the jaw equation is not switched on for ${sp?sp.common:'this species'} (Setup)`);
  if(c.gen&&(!c.storage||!c.gmethod||!c.tissue))w.push('Genetics: storage, method and tissue not all set');
  if(c.gen&&['storage','gmethod','tissue'].some(k=>c[k]==='other')&&!c.gnote.trim())w.push("Genetics 'Other' chosen without a note");
  if(wt!=null&&wt>0&&!c.tlcalc){const lk=tl!=null?'tl':fl!=null?'fl':null;
    if(lk){const L=+c[lk],fit=lwFit(c.sp,lk,c.editId);if(fit){const pred=fit.a+fit.b*Math.log(L),r=Math.log(wt)-pred,lim=Math.max(3*fit.sd,0.25);
      if(Math.abs(r)>lim)w.push(`Weight ${wt} g is unusual for a ${L} mm ${lk.toUpperCase()} ${sp.common} (about ${Math.round(Math.exp(pred))} g expected from ${fit.n} fish on this iPad)`)}}}
  return w}
const FIELDS=['tl','fl','wt','gwt','sex','stage','otoN','his','guts','micro','gen','storage','gmethod','tissue','gnote','time','block','depth','jaw','tlcalc','otoslide','tag','tagRec','cmt'];
function commit(){const b=activeB(),c=S.cur,miss=codeMissing(b);if(miss){toast(miss);return}
  if(!c.sp){c.warn=['Pick a species first'];c.ack=false;renderAttr();return}
  const sp=spBy(c.sp),old=c.editId?S.fish.find(f=>f.id===c.editId):null;
  const w=checks(c,sp);let newCode=null;
  if(old&&old.sp!==c.sp){newCode=nextCode(b,sp.acr);w.push(`Species changed, so the code changes from ${old.code} to ${newCode}. Relabel the envelope/vial`)}
  if(w.length&&!c.ack){c.warn=w;c.ack=true;renderAttr();return}
  const now=new Date();if(!b.h.wtOn)c.wt='';
  if(!b.letter){b.letter=freeLetter(b);b.dev=b.dev||S.device}
  const fill=f=>{FIELDS.forEach(k=>f[k]=k==='tagRec'&&c[k]?Object.assign({},c[k]):c[k]);f.oto=+f.otoN>0;f.gvial=f.gen?f.code:''};
  if(old){if(newCode){S.issued[old.code]&&(S.issued[old.code].st='replaced:'+newCode);S.issued[newCode]={b:b.id,f:old.id,t:now.toISOString(),st:'active'};old.code=newCode}
    fill(old);old.sp=c.sp;old.acr=sp.acr;old.spcode=sp.code;old.edited=now.toISOString();
    save();toast(`Updated ${old.code}`);S.cur=blankCur(c);S.cur.sp=old.sp;renderEntry();return}
  const code=nextCode(b,sp.acr),f={id:uid(),batch:b.id,dev:b.dev,seq:bFish(b.id).length+1,code,sp:c.sp,acr:sp.acr,spcode:sp.code,ts:now.toISOString(),tsl:localDT(now),edited:''};
  fill(f);S.fish.push(f);S.issued[code]={b:b.id,f:f.id,t:f.ts,st:'active'};b.done=false;save();
  S.cur=blankCur(c);S.cur.focus='tl';renderEntry();
  const lf=$('#lastFish');if(lf){lf.classList.remove('flash');void lf.offsetWidth;lf.classList.add('flash')}
  toast(`Saved ${code}. Write it on the envelope`)}
function startEdit(id){const f=S.fish.find(x=>x.id===id);if(!f)return;if(S.active!==f.batch)activate(f.batch);
  const c=blankCur({more:S.cur.more});FIELDS.forEach(k=>c[k]=f[k]==null?c[k]:(k==='tagRec'&&f[k]?Object.assign({},f[k]):f[k]));c.sp=f.sp;c.editId=f.id;
  if(MORE_TILES.some(k=>f[k])||f.time||f.otoslide)c.more=true;S.cur=c;
  if(view!=='entry')show('entry');else renderEntry();toast(`Editing ${f.code}`)}

const q=v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const TF=v=>v?'TRUE':'FALSE';
function procStaff(h){const sc=S.staff.find(x=>x.init===h.scribe);return [h.procName||h.procInit,sc?sc.name:h.scribe].filter(Boolean).join(', ')}
const ddOut=v=>v===''||v==null||isNaN(+v)?'':(+v).toFixed(5);
/* Column names follow the Access form labels; fish columns are in the datasheet's order. */
const BCOLS=[['Project',b=>b.h.project],['Date',b=>dmy(b.h.capDate)],['Bioregion',b=>b.h.bioregion],['Zone',b=>b.h.zone],['Location',b=>b.h.location],
  ['Temperature',b=>b.h.temp],['Salinity',b=>b.h.sal],['Depth',b=>depthM(b.h)],['Latitude',b=>ddOut(b.h.lat)],['Longitude',b=>ddOut(b.h.lon)],['Map coord',b=>b.h.mapRef],
  ['Collection Point',b=>b.h.collPoint],['Method',b=>b.h.method],['Collector',b=>b.h.collector],['Sector',b=>b.h.sector],['Bait/Lure',b=>b.h.bait],
  ['Date of Processing',b=>dmy(b.h.procDate)],['Processing Staff',b=>procStaff(b.h)],['Comments',b=>b.h.comments],['No. Samples species',b=>b.h.nsSp||nsAuto(b).sp],['No. Samples',b=>b.h.nsN||nsAuto(b).n],
  ['Multi.Block',b=>b.h.multiBlock],['Fisher',b=>b.h.fisherName],['PeopleID',b=>b.h.fisherId],['App_BatchID',b=>b.id]];
function gText(f,k){return f.gen?(f[k]==='other'?'other':f[k]):''}
function fishCmt(f){return [f.cmt,f.tlcalc?estNote():'',f.gen&&f.gnote?'Genetics: '+f.gnote:'',f.tagRec?`Tag recapture ${f.tagRec.tag}${f.tagRec.colour?' ('+f.tagRec.colour+')':''}`:''].filter(Boolean).join('; ')}
const otoTick=f=>f.otoN!==''&&f.otoN!=null?+f.otoN>0:!!f.oto;
const FCOLS=[['Otolith Code',f=>f.code],['Species',f=>{const s=spBy(f.sp);return s?s.code:f.spcode}],['TL',f=>f.tl],['FL',f=>f.fl],['TOTWT',f=>f.wt],['SEX',f=>f.sex],['Macro STA',f=>f.stage],
  ['GONADWT',f=>f.gwt],['Time',f=>f.time],['Block num',f=>f.block],['Depth',f=>f.depth],['GeneticsVial',f=>f.gvial],['Storage',f=>gText(f,'storage')],['Method',f=>gText(f,'gmethod')],
  ['Tissue',f=>gText(f,'tissue')],['His',f=>TF(f.his)],['Oto',f=>TF(otoTick(f))],['Jaw len',f=>f.jaw],['Eye op',()=>''],['TLcalculated',f=>TF(f.tlcalc)],['Oto slide',f=>f.otoslide],
  ['tag num',f=>f.tagRec?f.tagRec.tag:f.tag],['Guts',f=>TF(f.guts)],['Microchem',f=>TF(f.micro)],['Comments',f=>fishCmt(f)],['GeneticsID',f=>f.gen?f.code:''],['App_BatchID',f=>f.batch]];
const XCOLS=[['oto_count',f=>f.otoN],['fish_id',f=>f.id],['device',f=>f.dev],['seq_in_batch',f=>f.seq],['species_common',f=>spName(f.sp)],['species_sci',f=>f.sp],['acronym',f=>f.acr],
  ['species_other',f=>TF(spBy(f.sp)&&spBy(f.sp).other)],['tl_estimated_from_jaw',f=>TF(f.tlcalc)],['tag_colour',f=>f.tagRec?f.tagRec.colour:''],
  ['timestamp_utc',f=>f.ts],['time_local',f=>f.tsl],['edited_utc',f=>f.edited]];
const XB=[['batch_depth_entered',b=>b.h.depth],['batch_depth_unit',b=>(DEPTH_U[b.h.depthUnit||'m']||DEPTH_U.m)[0]],['lat_entered',b=>b.h.latRaw],['lon_entered',b=>b.h.lonRaw],['proc_initials',b=>b.h.procInit],['scribe_initials',b=>b.h.scribe],
  ['whole_fish_weighed',b=>TF(b.h.wtOn)],['batch_code',b=>batchTag(b)],['batch_complete',b=>TF(b.done)]];
const TCOLS=[['Otolith Code',f=>f.code],['Tag number',f=>f.tagRec.tag],['Tag colour',f=>f.tagRec.colour],['Recapture date',f=>dmy(bOf(f).h.capDate)],['Fisher',f=>f.tagRec.fisher],['Location',f=>f.tagRec.location],
  ['Latitude',f=>ddOut(bOf(f).h.lat)],['Longitude',f=>ddOut(bOf(f).h.lon)],['Species',f=>spName(f.sp)],['Species code',f=>{const s=spBy(f.sp);return s?s.code:''}],['TL',f=>f.tl],['FL',f=>f.fl],['TL estimated',f=>TF(f.tlcalc)],['Notes',f=>f.tagRec.notes],['App_BatchID',f=>f.batch]];

function scoped(scope){const bs=scope==='all'?S.batches:S.batches.filter(b=>b.id===S.active);const ids=new Set(bs.map(b=>b.id));return {bs,fs:S.fish.filter(f=>ids.has(f.batch))}}
function csv(kind,scope){const {bs,fs}=scoped(scope);
  if(kind==='batch')return [BCOLS.map(c=>q(c[0])).join(','),...bs.map(b=>BCOLS.map(c=>q(c[1](b))).join(','))].join('\r\n');
  if(kind==='fish')return [FCOLS.map(c=>q(c[0])).join(','),...fs.map(f=>FCOLS.map(c=>q(c[1](f))).join(','))].join('\r\n');
  if(kind==='tags'){const ts=fs.filter(f=>f.tagRec);return [TCOLS.map(c=>q(c[0])).join(','),...ts.map(f=>TCOLS.map(c=>q(c[1](f))).join(','))].join('\r\n')}
  const bc=BCOLS.filter(c=>c[0]!=='App_BatchID'),fc=FCOLS.filter(c=>c[0]!=='App_BatchID'),bcName=n=>['Depth','Method','Comments'].includes(n)?'Batch '+n:n;
  return [[...bc.map(c=>bcName(c[0])),...XB.map(c=>c[0]),...fc.map(c=>c[0]),...XCOLS.map(c=>c[0]),'batch_id'].map(q).join(','),
    ...fs.map(f=>{const b=bOf(f);return [...bc.map(c=>c[1](b)),...XB.map(c=>c[1](b)),...fc.map(c=>c[1](f)),...XCOLS.map(c=>c[1](f)),f.batch].map(q).join(',')})].join('\r\n')}
/* Rows to paste straight into the Access fish datasheet: tab-separated, no heading row, Otolith Code … GeneticsID. */
function accessRows(){const b=activeB();if(!b)return '';const cols=FCOLS.filter(c=>c[0]!=='App_BatchID');
  return bFish(b.id).map(f=>cols.map(c=>String(c[1](f)==null?'':c[1](f)).replace(/[\t\r\n]+/g,' ')).join('\t')).join('\r\n')}
function headerSheet(b){return BCOLS.filter(c=>!['App_BatchID'].includes(c[0])).map(c=>[c[0],c[1](b)])}
let exKind='fish',exScope='active';

    <p class="note">1. In Access, start a new record and type the header from the list below. 2. Tap <b>Copy fish rows</b>. 3. In the fish datasheet click the record selector of the blank new row and Paste Append. The rows run Otolith Code to GeneticsID in the datasheet's column order, with no heading row. Check the first paste against the screen.</p>

  <p class="note">Access tables use the form's column names, with blanks for anything not collected, dates as DD/MM/YYYY, depth in metres, positions in decimal degrees and tick boxes as TRUE/FALSE. Oto is ticked when 1 or 2 otoliths were extracted (the count is in the flat file). Eye op is left blank. Fish with TL estimated from jaw length have TLcalculated ticked and a note in Comments.</p>
  <textarea class="csv" id="csvOut" readonly aria-label="CSV output">${esc(txt)}</textarea>
  <div class="actions"><button class="btn primary" id="copyCsv">Copy CSV</button>${top?'<button class="btn" id="dlCsv">Save CSV file</button>':''}<button class="btn" id="fullBk">Full backup file</button></div>
  ${top?'':'<p class="note">In this preview, use Copy. The installed app also saves the CSV to Files or shares it to Mail.</p>'}`;

      if([...spAll().values()].some(x=>x.acr===v&&x.sci!==s.sci)){toast(v+' is already used');e.target.value=s.acr;return}}

    if(k==='stages')v=+v;setE(s.sci,{[k]:v});toast('Saved')}}
async function storeInfo(){const el=$('#storeInfo');if(!el)return;let used='',pers='unknown';
  try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();used=`${(e.usage/1e6).toFixed(1)} MB used of about ${Math.round(e.quota/1e6)} MB`}}catch(e){}
  try{if(navigator.storage&&navigator.storage.persisted)pers=(await navigator.storage.persisted())?'granted':'not granted (back up regularly)'}catch(e){}
  el.innerHTML=`${S.fish.length} fish in ${S.batches.length} batch(es); ${Object.keys(S.issued).length} codes issued on this iPad. Main store: <b>${db?(dbOk===false?'last save failed':'OK'):'unavailable'}</b> · Second copy: <b>${lsOk?'OK':'full (main store still saving)'}</b> · Permanent storage: ${pers}${used?' · '+used:''}.`}
function previewRestore(txt){const out=$('#rsOut');let b;
  try{b=JSON.parse(txt)}catch(e){out.innerHTML='<p class="warn">That file is not a Lab Logger backup.</p>';return}
  if(!b||b.app!=='lab-logger'||!b.state||!Array.isArray(b.state.fish)||!Array.isArray(b.state.batches)){out.innerHTML='<p class="warn">That file is not a Lab Logger backup.</p>';return}
  const B=fillDefaults(JSON.parse(JSON.stringify(b.state))),haveF=new Set(S.fish.map(f=>f.id)),haveB=new Set(S.batches.map(x=>x.id));
  const nF=B.fish.filter(f=>!haveF.has(f.id)),nB=B.batches.filter(x=>!haveB.has(x.id));
  const codesHere=new Set(S.fish.map(f=>f.code)),clash=nF.filter(f=>codesHere.has(f.code));
  out.innerHTML=`<p class="note">Backup from iPad <b>${esc(b.device||'?')}</b>, saved ${esc((b.exportedAt||'').replace('T',' ').slice(0,16))} UTC: <b>${B.batches.length}</b> batches, <b>${B.fish.length}</b> fish. This iPad has ${S.batches.length} batches, ${S.fish.length} fish.</p>
   ${clash.length?`<p class="warn">${clash.length} fish in the backup have codes already used here (e.g. ${esc(clash[0].code)}). They will be added but flagged as duplicates to rename.</p>`:''}
   <div class="actions"><button class="btn primary" id="rsMerge">Add missing (${nB.length} batches, ${nF.length} fish)</button><button class="btn danger" id="rsReplace">Replace everything on this iPad</button></div>
   <p class="note"><b>Add missing</b> keeps everything here and adds what is only in the backup. <b>Replace</b> makes this iPad an exact copy of the backup, including its iPad letter, so it carries on where the other iPad left off.</p>`;
  $('#rsMerge').onclick=()=>{S.fish=S.fish.concat(nF).sort((x,y)=>String(x.ts).localeCompare(String(y.ts)));S.batches=S.batches.concat(nB);
    Object.keys(B.issued||{}).forEach(c=>{if(!S.issued[c])S.issued[c]=B.issued[c]});
    (B.spCustom||[]).forEach(s=>{if(!S.spCustom.some(x=>x.sci===s.sci))S.spCustom.push(s)});spReset();
    (B.staff||[]).forEach(p=>{if(!S.staff.some(x=>x.init===p.init))S.staff.push(p)});save();toast(`Added ${nB.length} batches and ${nF.length} fish`);show('batches')};
  $('#rsReplace').onclick=e=>armed(e.target,'Tap again to replace all data',()=>{const ui=S.ui;S=B;S.ui=ui;spReset();
    if(!S.batches.find(x=>x.id===S.active))S.active=null;applyUi();save();toast(`Restored ${S.fish.length} fish`);show('batches')})}

/* ---------- boot ---------- */
document.addEventListener('pointerdown',function(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}},{once:true});
(async()=>{
  db=await openDB();
  const a=db?await idbLoad():null,b=lsLoad();
  if(a){a.fish.sort((x,y)=>String(x.ts).localeCompare(String(y.ts)));a.fish.forEach(r=>savedJson.set(r.id,JSON.stringify(r)))}
  const pick=a&&b?((a.savedAt||'')>=(b.savedAt||'')?a:b):(a||b);
  S=pick?fillDefaults(pick):fresh();
  applyUi();save();show(S.active&&activeB()?'entry':'batches');
})();
})();

<script>
/* Updates: a new version is fetched fresh from the website (never from the iPad's web cache),
   then a "Restart to update" button appears. Tapping it reloads into the new version. */
(function(){if(!('serviceWorker' in navigator))return;
  function offer(){if(document.getElementById('updBar'))return;const b=document.createElement('button');b.id='updBar';
    b.textContent='Update downloaded · tap to restart';b.style.cssText='position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;min-height:52px;padding:0 22px;border-radius:999px;border:0;font:600 16px system-ui,-apple-system,sans-serif;background:#3ab36a;color:#04200e;box-shadow:0 4px 18px rgba(0,0,0,.35)';
    b.onclick=()=>{navigator.serviceWorker.getRegistration().then(r=>{if(r&&r.waiting){r.waiting.postMessage('skipWaiting');setTimeout(()=>location.reload(),400)}else location.reload()})};document.body.appendChild(b)}
  /* never reload by itself (it could interrupt a fish being keyed); offer a restart instead */
  navigator.serviceWorker.addEventListener('controllerchange',offer);
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
    if(r.waiting&&navigator.serviceWorker.controller)offer();
    r.addEventListener('updatefound',()=>{const w=r.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)offer()})});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update().catch(()=>{})});
  }).catch(()=>{})});
  window.checkForUpdate=function(){return navigator.serviceWorker.getRegistration().then(r=>{if(!r)return 'none';if(r.waiting){offer();return 'ready'}
    return r.update().then(()=>new Promise(res=>setTimeout(()=>res(r.installing||r.waiting?'downloading':'latest'),1500)))}).catch(()=>'offline')};
})();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
